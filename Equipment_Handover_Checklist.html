<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#253746">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-wAfZOT6UMOqkrb7odoZocORQXsB3OTmiGhDgf6wTGsk='; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>TAWAL – Equipment Handover Checklist</title>
<style>:root{
  --navy:#253746; --navy2:#314a5e; --orange:#F26522; --orangeD:#C4470E; --bg:#eef2f5; --card:#fff; --ink:#1d2a35; --muted:#5f6d78;
  --line:#d8dee4; --ok:#17734a; --okbg:#e3f5ec; --nok:#c62828; --nokbg:#fdecec; --na:#6b7785; --nabg:#eef0f2;
  --warn:#9a5b12; --warnbg:#fff4e0; --info:#2f5597; --infobg:#e8effb; --msp:#6a4c93; --mspbg:#f1ecf8;
  --r:12px; --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;width:100%;min-height:46px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--orange);outline-offset:1px;border-color:transparent}
input.bad,select.bad{border-color:var(--nok);background:var(--nokbg)}
input.good,select.good{border-color:var(--ok);background:var(--okbg)}
[hidden]{display:none!important}

/* top bar */
#top{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
#top .row1{display:flex;align-items:center;gap:10px;padding:8px 14px;max-width:1100px;margin:0 auto}
#top img{height:26px}
#top .title{font-weight:700;font-size:15px;flex:1;line-height:1.2}
#top .title small{display:block;font-weight:400;opacity:.75;font-size:12px}
#top .lang{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);min-height:34px;padding:4px 8px;width:auto;border-radius:8px}
#top .lang option{color:#000}
#steps{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;max-width:1100px;margin:0 auto;scrollbar-width:none}
#steps::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
.step .dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35)}
.step.done .dot{background:#4cd08a}
.step.issue .dot{background:#ff8a80}
.step.on{background:#fff;color:var(--navy);font-weight:700}
#bar{height:4px;background:rgba(255,255,255,.15)}
#bar i{display:block;height:100%;background:var(--orange);width:0;transition:width .3s}

main{max-width:1100px;margin:0 auto;padding:16px 14px 110px}
.page-h{display:flex;align-items:baseline;gap:10px;margin:4px 2px 12px}
.page-h h1{font-size:22px;margin:0;line-height:1.2}
.page-h .cnt{color:var(--muted);font-size:14px}
.lead{color:var(--muted);margin:-4px 2px 14px;font-size:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600}
.fld label .req{color:var(--nok)}
.fld .sub{font-size:12px;color:var(--muted);margin-top:4px}
.fld .inl{display:flex;gap:8px}
.fld .inl > *{flex:1}

/* items */
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;position:relative}
.item.ok{border-left:5px solid var(--ok)}
.item.nok{border-left:5px solid var(--nok)}
.item.na{border-left:5px solid var(--na)}
.item.msp.nok{border-left-color:var(--msp)}
.item .q{display:flex;gap:10px;align-items:flex-start}
.item .num{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--muted);background:var(--nabg);border-radius:6px;padding:2px 6px;margin-top:2px}
.item .txt{flex:1;font-weight:600}
.item .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;letter-spacing:.02em}
.tag.auto{background:var(--infobg);color:var(--info)}
.tag.msp{background:var(--mspbg);color:var(--msp)}
.tag.cam{background:var(--warnbg);color:var(--warn)}
.hintbtn{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:50%;width:32px;height:32px;font-weight:700;color:var(--info);cursor:pointer}
.hint{background:var(--infobg);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px;color:#1b3056}
.hint b{color:#12264a}
.hint table{border-collapse:collapse;margin-top:6px;font-size:13px}
.hint td,.hint th{border:1px solid #c7d4ec;padding:3px 6px;text-align:left}
.ans{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ans button{flex:1 1 90px;min-height:48px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:16px;cursor:pointer}
.ans button.s-ok{border-color:var(--ok);background:var(--ok);color:#fff}
.ans button.s-nok{border-color:var(--nok);background:var(--nok);color:#fff}
.ans button.s-na{border-color:var(--na);background:var(--na);color:#fff}
.ans button.s-sel{border-color:var(--navy);background:var(--navy);color:#fff}
.autores{margin-top:10px;border-radius:10px;padding:9px 12px;font-weight:700;font-size:15px}
.autores.ok{background:var(--okbg);color:var(--ok)}
.autores.nok{background:var(--nokbg);color:var(--nok)}
.autores.pend{background:var(--nabg);color:var(--muted);font-weight:600}
.autores.info{background:var(--infobg);color:var(--info)}
.autores small{display:block;font-weight:500;font-size:13px;margin-top:2px}
.extra{margin-top:10px}
.extra textarea,.extra input{min-height:44px}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.photos img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.pbtn{border:1px dashed var(--warn);background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer;min-height:44px}
.pbtn.have{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.th{position:relative}
.th .x{position:absolute;top:-6px;right:-6px;background:var(--nok);color:#fff;border:0;border-radius:50%;width:22px;height:22px;font-size:13px;cursor:pointer;line-height:22px;padding:0}

.item.autoi{padding:10px 12px}
.item.autoi .txt{font-weight:500;font-size:15px}
.item.autoi .txt small{display:block;color:var(--muted);font-size:13px;margin-top:2px;font-weight:400}
.item.autoi.nok .txt small{color:var(--nok)}
.item .txt small.mspn{color:var(--msp)!important}
.pill{flex:0 0 auto;font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;margin-top:1px}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.nok{background:var(--nokbg);color:var(--nok)}.pill.pend{background:var(--nabg);color:var(--muted)}
@media(max-width:560px){#top .title small{display:none}#top .title{font-size:14px}#top img{height:22px}}
/* readings rows */
.rd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--nabg)}
.rd:last-child{border-bottom:0}
.rd .lbl{flex:1 1 220px;font-weight:600;font-size:15px}
.rd .lbl small{display:none;font-weight:400;color:var(--info);font-size:12px}
.showt .rd .lbl small{display:block}
.rd input,.rd select{flex:0 0 130px;width:130px;min-height:42px;padding:8px}
.rd .res{flex:0 0 64px;text-align:center;font-weight:800;font-size:13px;border-radius:8px;padding:6px 4px}
.rd .res.ok{background:var(--okbg);color:var(--ok)}
.rd .res.nok{background:var(--nokbg);color:var(--nok)}
.rd .res.pend{background:var(--nabg);color:var(--muted)}
@media(max-width:560px){.rd .lbl{flex-basis:100%}.rd input,.rd select{flex:1 1 70px;width:auto;min-width:0}}
.cardh{display:flex;align-items:center;gap:8px;margin-bottom:6px}.cardh h2{flex:1;margin:0}
.tbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:700;color:var(--info);cursor:pointer}
.bms{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--nabg)}
.bms .v{font-size:12px;color:var(--muted);margin-top:2px}
.bms .ans{margin:0}
.bms .ans button{flex:0 0 64px;min-height:42px;font-size:14px}
.grp{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}

/* battery register */
.bb{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:#fbfcfd}
.bb .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:800}
.bb .hd .sp{flex:1}
.bb .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;min-height:44px}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.del{color:var(--nok);border-color:#f1b5b5}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.warnbox{background:var(--warnbg);color:#6b3f06;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.errbox{background:var(--nokbg);color:#8b1a1a;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px;font-weight:600}
.infobox{background:var(--infobg);color:#1b3056;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}

/* bottom nav */
#nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:30;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
#nav .in{max-width:1100px;margin:0 auto;display:flex;gap:10px;align-items:center}
#nav .btn{flex:1}
#nav .mid{flex:0 0 auto;font-size:13px;color:var(--muted);text-align:center;min-width:70px}

/* result */
.result{border-radius:var(--r);padding:18px;text-align:center;margin-bottom:12px;font-weight:800;font-size:22px}
.result small{display:block;font-size:14px;font-weight:600;margin-top:4px}
.result.acc{background:var(--okbg);color:var(--ok)}
.result.con{background:var(--warnbg);color:var(--warn)}
.result.rej{background:var(--nokbg);color:var(--nok)}
.result.pen{background:var(--nabg);color:var(--muted)}
.nclist{list-style:none;margin:0;padding:0}
.nclist li{padding:8px 0;border-bottom:1px solid var(--nabg);font-size:14px;display:flex;gap:8px;align-items:flex-start}
.nclist li .sev{flex:0 0 auto;font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px}
.sev.Major{background:var(--nokbg);color:var(--nok)}
.sev.Minor{background:var(--warnbg);color:var(--warn)}
.sev.MSP{background:var(--mspbg);color:var(--msp)}
.miss li{cursor:pointer}
.miss li:hover{background:var(--nabg)}
.sig{border:1px dashed var(--line);border-radius:10px;background:#fff;width:100%;height:150px;touch-action:none}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:80;display:flex;align-items:center;justify-content:center}
#lightbox img{max-width:96vw;max-height:90vh}
.flash{animation:fl 1.6s}
@keyframes fl{0%,60%{box-shadow:0 0 0 4px var(--orange)}100%{box-shadow:none}}
.center{text-align:center}
.muted{color:var(--muted)}
.big{font-size:18px}
html[dir=rtl] .th .x{right:auto;left:-6px}
html[dir=rtl] .item.ok,html[dir=rtl] .item.nok,html[dir=rtl] .item.na{border-left:1px solid var(--line)}
html[dir=rtl] .item.ok{border-right:5px solid var(--ok)}
html[dir=rtl] .item.nok{border-right:5px solid var(--nok)}
html[dir=rtl] .item.na{border-right:5px solid var(--na)}

/* print report */
#report{display:none}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff;font-size:10.5pt}
  #top,#nav,main,.toast,#lightbox{display:none!important}
  #report{display:block}
  .rp-h{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:8px 12px;border-radius:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rp-h img{height:22px}
  .rp-h h1{font-size:14pt;margin:0;flex:1}
  .rp table{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:9pt}
  .rp th,.rp td{border:1px solid #bbb;padding:3px 5px;text-align:left;vertical-align:top}
  .rp th{background:#eef2f5;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rp h2{font-size:11.5pt;margin:12px 0 4px;color:var(--navy);border-bottom:2px solid var(--orange);padding-bottom:2px;page-break-after:avoid}
  .rp .res{font-size:14pt;font-weight:800;padding:8px;border-radius:6px;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rp .ok{color:#1e8e5a}.rp .nok{color:#c62828;font-weight:700}.rp .na{color:#6b7785}
  .rp .calc{font-size:8pt;color:#333}
  .rp .ph{display:inline-block;width:31%;margin:0 1% 8px 0;vertical-align:top;page-break-inside:avoid;font-size:8pt}
  .rp .ph img{width:100%;border:1px solid #ccc}
  .rp .sigs{display:flex;gap:20px}
  .rp .sigs div{flex:1;border:1px solid #bbb;padding:6px;min-height:90px}
  .rp .sigs img{max-height:70px}
  tr{page-break-inside:avoid}
}

.fld.wide{grid-column:1/-1}
.fld .inl > input{flex:1 1 auto;min-width:0}.fld .inl > .btn{flex:0 0 auto;white-space:nowrap}

/* language picker */
.langw{position:relative}
#top .lang{display:flex;align-items:center;gap:6px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);min-height:36px;padding:4px 10px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
#top .lang b{font-weight:400;opacity:.7;font-size:11px}
.flag{width:22px;height:16.5px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.15);object-fit:cover;flex:0 0 auto}
#top .lang .flag{height:16.5px}
.langmenu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;background:#fff;color:var(--ink,#1d2a35);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.22);padding:6px;min-width:180px;z-index:50}
.langmenu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:10px 12px;border-radius:8px;font:inherit;font-size:15px;color:inherit;cursor:pointer;text-align:start;min-height:44px}
.langmenu button:hover,.langmenu button.on{background:#f1f4f7}
.langmenu button i{margin-inline-start:auto;font-style:normal;color:#1e8e5a;font-weight:700}
@media(max-width:420px){#top .lang{padding:4px 7px;font-size:13px;gap:5px}#top .title{font-size:13px}}
@media(max-width:339px){#top .title{display:none}#top .row1{justify-content:space-between}}
#navmid{direction:ltr;unicode-bidi:isolate}
html[lang=ur] body{line-height:1.7}

/* location gate */
#gate{position:fixed;inset:0;z-index:100;background:rgba(18,30,40,.92);display:flex;align-items:center;justify-content:center;padding:18px}
#gate[hidden]{display:none}
#gate .gbox{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:24px 20px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#gate .gico{font-size:44px;line-height:1}
#gate h2{margin:10px 0 6px;font-size:20px;color:var(--navy,#253746)}
#gate p{margin:6px 0;font-size:15px;color:#4a5866;line-height:1.5}
#gate .gmsg{background:#f1f4f7;border-radius:10px;padding:10px 12px;color:#253746}
#gate .gmsg.bad{background:#fdecea;color:#b3261e}
#gate .btn{margin-top:14px;width:100%;min-height:48px;font-size:16px}
body.gated{overflow:hidden}
@media print{#gate{display:none!important}}

/* per-row setting photos */
.rd .rph{flex:1 1 100%;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.rd .rph img{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer}
.pbtn.sm{min-height:36px;padding:6px 10px;font-size:13px;border-radius:8px}
.pbtn.reuse{border-style:solid;border-color:var(--line);background:#fff;color:var(--navy,#253746);font-weight:600}

/* ===== audit round 1 fixes ===== */
.btn.pri,#nav .btn.pri{background:var(--orangeD);border-color:var(--orangeD)}
#bar i{background:var(--orangeD)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{min-height:40px;padding:8px 12px}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--muted);font-weight:600}
.row.foot{margin-top:18px;justify-content:space-between;flex-wrap:wrap;gap:10px}
.hintbtn{width:40px;height:40px}
.tbtn{min-height:40px;padding:8px 12px}
#top .lang{min-height:40px}
.pbtn.sm{min-height:40px}
.pbtn.opt{border-style:dashed;border-color:var(--line);background:#fff;color:var(--muted)}
.th .x{width:30px;height:30px;line-height:30px;top:-10px;right:-10px;font-size:16px}
html[dir=rtl] .th .x{right:auto;left:-10px}
.photos,.rd .rph{gap:12px}
.phmiss{display:inline-flex;width:64px;height:64px;align-items:center;justify-content:center;text-align:center;font-size:10px;background:var(--nokbg);color:var(--nok);border-radius:8px;padding:2px}
.rd .rph .phmiss{width:44px;height:44px;font-size:8px}
.numerr{flex:1 1 100%;color:var(--nok);font-size:12.5px;margin-top:3px}
.rd .lbl small.wait{display:block;color:var(--warn)}
.rd.fail .lbl small{display:block;color:var(--nok)}
.hint{text-align:start}.hint table{direction:ltr}
.sev.Info{background:var(--infobg);color:var(--info)}
.mgrp{border-bottom:1px solid var(--nabg);padding:4px 0}
.mgrp summary{cursor:pointer;padding:8px 0;min-height:40px;display:flex;align-items:center;gap:8px;list-style:none}
.mgrp summary::-webkit-details-marker{display:none}
.mgrp summary:before{content:'▸';color:var(--muted)} .mgrp[open] summary:before{content:'▾'}
.cntb{background:var(--nabg);color:var(--ink);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700}
.nclist.miss li{min-height:44px;align-items:center;cursor:pointer}
.nclist li{min-height:40px}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
#lightbox{flex-direction:column;gap:12px}
#lbclose{background:#fff;min-width:140px}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
#nav{padding-left:calc(14px + env(safe-area-inset-left));padding-right:calc(14px + env(safe-area-inset-right))}
#nav .btn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:420px){ .bb .grid{grid-template-columns:1fr 1fr} .bb .fld.wide{grid-column:1/-1} select{padding-inline-end:28px;text-overflow:ellipsis} }
@media(min-width:900px){
  #steps{flex-wrap:wrap;overflow:visible}
  .ans{max-width:460px}
  .rd{display:grid;grid-template-columns:minmax(260px,1fr) 150px 150px 72px;align-items:center}
  .rd:not(.two){grid-template-columns:minmax(260px,1fr) 150px 72px}

function balanceLimit(n){   // worst case of round-robin split with ±5 % load sharing + 3 pts meter (owner 10C/10E)
  if(!isFinite(n)||n<1) return NaN;
  var c=[0,0,0]; for(var i=0;i<n;i++) c[i%3]++;
  var best=0, s=[1.05,0.95];
  for(var a=0;a<2;a++)for(var b=0;b<2;b++)for(var d=0;d<2;d++){ var p=[c[0]*s[a],c[1]*s[b],c[2]*s[d]], av=(p[0]+p[1]+p[2])/3; if(av<=0) continue; var m=Math.max(Math.abs(p[0]-av),Math.abs(p[1]-av),Math.abs(p[2]-av))/av; if(m>best) best=m; }
  return best*100 + 3;
}
function measuredImbalance(C){ if(!C.iOk) return NaN; var a=(C.ia[0]+C.ia[1]+C.ia[2])/3; if(a<=0) return NaN; return Math.max(Math.abs(C.ia[0]-a),Math.abs(C.ia[1]-a),Math.abs(C.ia[2]-a))/a*100; }
function n1Calc(C){
  var I=C.I, cap=C.modW, m=C.nmod;
  if (!isFinite(I)||!isFinite(cap)||cap<=0||!isFinite(m)) return null;
  var o={I:I,cap:cap,m:m}, lines=[];
  if (C.hy){
    var loadA = I*54/48, acuA = C.nac*C.wac*0.3/48, rech = 0.2*C.newAh;
    o.totalA = loadA+acuA+rech; o.totW = o.totalA*54;
    lines.push('Hybrid (design sheet Rev.2): load '+r1(loadA)+' A (I × 54/48) + DC ACU '+r1(acuA)+' A (cooling W × 0.3 ÷ 48) + recharge 0.2 C × '+C.newAh+' Ah = '+r1(rech)+' A → '+r1(o.totalA)+' A');
  } else {
    var dcW = I*1.1*54, acW = C.nac*C.wac*0.3, T = isFinite(C.T)?C.T:4, chW, v;
    if (C.cust==='Zain'||C.aramco){ chW = Math.max(0.10*C.sumAh*54, 0.1*T*I*1.1*54); v=(C.aramco?'Aramco Digital':'Zain')+': charging = max(10 % × '+C.sumAh+' Ah, 0.1 × '+T+' h × I × 1.1) × 54'; }
    else { chW = Math.max((10*C.liCount + 0.10*C.vrlaAh)*54, 0.1*T*I*1.1*54); v='Charging = max(10 A × '+C.liCount+' Li-Ion + 10 % × '+C.vrlaAh+' Ah VRLA, 0.1 × '+T+' h × I × 1.1) × 54'; }
    o.totW = dcW+acW+chW; o.chA = chW/54;
    lines.push('DC load '+Math.round(dcW)+' W (I × 1.1 × 54) + DC ACU '+Math.round(acW)+' W (× 0.3) + charging '+Math.round(chW)+' W');
    lines.push(v);
  }
  o.N = o.totW/cap; var fr=o.N-Math.floor(o.N); o.Nr = fr>0.2+1e-9? Math.ceil(o.N) : Math.floor(o.N);
  o.req = Math.max(o.Nr+1,3); o.ok = m>=o.req;
  lines.push('N = '+Math.round(o.totW)+' W ÷ '+cap+' W = '+r2(o.N)+' → '+o.Nr+' (round up if fraction > 0.2) → N+1 = '+(o.Nr+1)+', minimum 3 → required '+o.req+'; installed '+m);
  o.lines=lines; return o;
}

    var sec=num(S.f.ac_sec); if(isFinite(sec)&&num(S.f.ac_mdb)>sec) calc+=' · Note: MDB main CB is higher than the SEC-side MCCB.'; if(rcb>100) calc+=' · Info: DC feed above 100 A per operator – needs design approval.';
    return bad.length? R('nok',bad.join('; '),calc) : R('ok','Meets Table 1',calc); }},

 {id:'B5',sec:'bat',grp:'Compatibility',type:'auto',sev:'NA',show:function(C){return C.newBB && C.exLi.length>0;},t:'New Li-Ion batteries are not paralleled with Li-Ion older than 3 years (spread ≤ 36 months).',

 {id:'B6',sec:'bat',grp:'Compatibility',type:'auto',sev:'Major',show:function(C){return C.newBB && C.exRows.length>0;},t:'Existing batteries are not 36 months or more older than the new batteries.',

function val(x,C){ return typeof x==='function'? x(C) : x; }
function secShown(id,C){
  if(!C.eq) return id==='job'||id==='res';
  switch(id){
    case 'ac': return C.newDC || C.newBB;
    case 'dc': case 'dist': return C.newDC;
    case 'mcu': return C.newDC || C.newBB;
    case 'bat': return true;
    case 'bms': return C.newBB;
    case 'hy': return C.hy;
    default: return true;
  }
}
function needsPhoto(it){ if(photosWaived() && it.id!=='S2') return false; if(it.id==='S2' && S.ans.S2 && S.ans.S2.v==='nok') return false; if(it.nophoto) return false; return !!it.photo || it.type==='chk' || it.type==='choice'; }   // owner: photo for every OK/NOK item
function itemShown(it,C){ if(C.noBB && it.sec==='bat') return false; return secShown(it.sec,C) && (!it.show || !!it.show(C)); }
function ownerOf(it,C){
  var o=it.owner||'impl';
  if(o==='site') return C.b2s? 'impl':'msp';
  if(o==='dcx') return C.newDC? 'impl':'msp';
  if(o==='bbx') return C.newBB? 'impl':'msp';
  return o;
}
function itemText(it,C){ return val(it.t,C); }
function itemSev(it,C){ return val(it.sev,C)||'Minor'; }
/* result of one item: {r:'ok'|'nok'|'na'|null, sev, msg, calc} */
function evalItem(it,C){
  var a=S.ans[it.id]||{};
  if(it.type==='auto'){ var x=it.auto(C)||PENDING(); return {r:x.r, sev:itemSev(it,C), msg:x.msg, calc:x.calc, auto:1}; }
  if(it.force){ var fz=it.force(C); if(fz) return {r:'nok', sev:itemSev(it,C), msg:fz.msg, forced:1}; }
  if(it.type==='choice'){ if(!a.v) return {r:null}; var ch=it.choices.filter(function(c){return c[0]===a.v;})[0]; if(!ch) return {r:null}; return ch[2]? {r:'nok',sev:ch[2],msg:ch[1]} : {r:'ok'}; }
  if(!a.v) return {r:null};
  if(a.v==='nok' && it.follow && a.fu==='Y') return {r:'ok', msg:'Compatible cable already available at MC / district'};
  return {r:a.v, sev:itemSev(it,C)};
}
function numbering(C){
  var map={}, si=0;
  SECTIONS.forEach(function(sec){
    if(sec.id==='job'||sec.id==='res'||!secShown(sec.id,C)) return; si++;
    var n=0; ITEMS.forEach(function(it){ if(it.sec===sec.id && itemShown(it,C)){ n++; map[it.id]=si+'.'+n; } });
    map['sec:'+sec.id]=si;
  });
  return map;
}
function fieldShown(fd,C){ return !fd.show || !!fd.show(C); }
function evaluate(){
  var C=ctx(), num_=numbering(C), out={C:C,num:num_,missing:[],nc:[],msp:[],info:[],total:0,answered:0,bySec:{}};
  var waived=photosWaived();
  function sec(id){ return out.bySec[id]=out.bySec[id]||{total:0,done:0,nok:0,miss:0}; }
  /* structured entry: t = English key (translated on screen), pre = English prefix key, n = item number, suf = untranslated detail */
  function miss(secId,t,anchor,pre,n,suf){ var label=(pre?pre+': ':'')+(n&&n.charAt(0)!=='#'?n+' ':'')+t+(n&&n.charAt(0)==='#'?' '+n:'')+(suf?' – '+(Array.isArray(suf)?suf.join(', '):suf):''); out.missing.push({sec:secId,label:label,anchor:anchor,t:t,pre:pre||'',n:n||'',suf:suf||''}); sec(secId).miss++; }
  // fields
  Object.keys(FIELDS).forEach(function(sid){
    if(!secShown(sid,C)) return;
    FIELDS[sid].forEach(function(fd){ if(!fieldShown(fd,C)) return; var v=S.f[fd.k]; if(!has(v) && fd.def){ var d=fd.def(); if(has(d)) v=d; }
      if(val(fd.req,C) && !has(v)) miss(sid,fd.l,'f_'+fd.k);
      else if(fd.type==='num' && badNum(v)) miss(sid,fd.l,'f_'+fd.k,'Numbers only');
      else if(fd.int && has(v) && num(v)%1!==0) miss(sid,fd.l,'f_'+fd.k,'Whole number only');
      else if(fd.type==='sel' && has(v) && !(fd.o(C)||[]).some(function(o){return String(o[0])===String(v);})) miss(sid,fd.l,'f_'+fd.k,'Choose again');
      else if(fd.type==='tel' && has(v) && !phoneOk(v)) miss(sid,fd.l,'f_'+fd.k,'Check the mobile number');
    });
  });
  // handover date: today or up to 7 days back (no back-dating)
  if(has(S.f.job_date)){ var dd=(new Date(jobStartDate()+'T00:00:00')-new Date(S.f.job_date+'T00:00:00'))/86400000; if(!dateOk(S.f.job_date) || dd>7 || S.f.job_date>todayRiyadh()) miss('job','Handover date','f_job_date','Handover date cannot be in the future or more than 7 days before the job was started'); }
  // AC readings
  if(secShown('ac',C)) AC_READ.forEach(function(r){ if(!has(S.f[r.k])) miss('ac',r.l,'f_'+r.k); else if(badNum(S.f[r.k])) miss('ac',r.l,'f_'+r.k,'Numbers only'); });
  // photo slots on data pages
  if(!waived) photoSlots(C).forEach(function(p){ if(!hasPhoto(p.k)) miss(p.sec,p.l,'ph_'+p.k,'Photo'); });

  if(secShown('bat',C) && !C.noBB){
    if(C.newBB && !C.newRows.length) miss('bat','Add the new batteries to the register','bbreg');

Object.assign(I18N.ar, {"220/380V Conversion Kit Installed?": "هل طقم التحويل 220/380V مركّب؟", "Does the DC system internal main CB also feed other AC loads (AC cooling unit, fans, lights, sockets)?": "هل يغذّي القاطع الرئيسي الداخلي لنظام DC أحمال AC أخرى (وحدة تكييف AC، مراوح، إنارة، مقابس)؟", "Modules need about 220 V. On a 220/127 V site the only approved connection is the 220/380V conversion kit (phase-to-phase). A normal L-N connection feeds the modules with 127 V (derated, overload and fire risk). The kit must not be used on a 380/220 V site.": "تحتاج الموديولات إلى نحو 220 V. في موقع 220/127 V التوصيل الوحيد المعتمد هو طقم التحويل 220/380V (طور-طور). التوصيل العادي L-N يغذي الموديولات بـ 127 V (قدرة منخفضة وخطر حمل زائد وحريق). لا يُستخدم الطقم في موقع 380/220 V.", "220/380V conversion kit is installed in a visible and accessible place, with its nameplate readable.": "طقم التحويل 220/380V مركّب في مكان ظاهر وسهل الوصول، ولوحة بياناته مقروءة.", "Total rectifier output current shown on MCU (A) (load + battery charging)": "إجمالي تيار خرج الموحّدات المعروض على MCU (A) (الحمل + شحن البطاريات)", "Input power = 1.732 × L-L voltage × phase current (averages of the meter readings at the DC system internal main CB). Output power = DC output voltage × total rectifier current shown on the MCU. Efficiency = output ÷ input. Spec minimum 95 %, less 3 % meter tolerance: OK from 92 % to 100 %. Below 92 % is information only at light load (below 20 % of module capacity) or when the internal main CB also feeds other AC loads. Above 100 % means the readings do not match.": "قدرة الدخل = 1.732 × جهد L-L × تيار الفاز (متوسط قراءات الجهاز عند القاطع الرئيسي الداخلي لنظام DC). قدرة الخرج = جهد خرج DC × إجمالي تيار الموحّدات المعروض على MCU. الكفاءة = الخرج ÷ الدخل. الحد الأدنى في المواصفات 95 %، ناقص 3 % لدقة الجهاز: مقبول من 92 % إلى 100 %. أقل من 92 % للعلم فقط عند الحمل الخفيف (أقل من 20 % من قدرة الموديولات) أو إذا كان القاطع الرئيسي الداخلي يغذّي أحمال AC أخرى. أعلى من 100 % Object.assign(I18N.ur, {"220/380V Conversion Kit Installed?": "کیا 220/380V کنورژن کٹ لگی ہوئی ہے؟", "Does the DC system internal main CB also feed other AC loads (AC cooling unit, fans, lights, sockets)?": "کیا DC سسٹم کا اندرونی مین CB دوسرے AC لوڈز کو بھی سپلائی دیتا ہے (AC کولنگ یونٹ، پنکھے، لائٹس، ساکٹس)؟", "Modules need about 220 V. On a 220/127 V site the only approved connection is the 220/380V conversion kit (phase-to-phase). A normal L-N connection feeds the modules with 127 V (derated, overload and fire risk). The kit must not be used on a 380/220 V site.": "ماڈیولز کو تقریباً 220 V چاہیے۔ 220/127 V سائٹ پر واحد منظور شدہ کنکشن 220/380V کنورژن کٹ (فیز ٹو فیز) ہے۔ عام L-N کنکشن ماڈیولز کو 127 V دیتا ہے (کم پاور، اوورلوڈ اور آگ کا خطرہ)۔ 380/220 V سائٹ پر کٹ استعمال نہ کریں۔", "220/380V conversion kit is installed in a visible and accessible place, with its nameplate readable.": "220/380V کنورژن کٹ نظر آنے والی اور قابل رسائی جگہ پر لگی ہے، اور اس کی نیم پلیٹ پڑھی جا سکتی ہے۔", "Total rectifier output current shown on MCU (A) (load + battery charging)": "MCU پر دکھایا گیا ریکٹیفائرز کا کل آؤٹ پٹ کرنٹ (A) (لوڈ + بیٹری چارجنگ)", "Input power = 1.732 × L-L voltage × phase current (averages of the meter readings at the DC system internal main CB). Output power = DC output voltage × total rectifier current shown on the MCU. Efficiency = output ÷ input. Spec minimum 95 %, less 3 % meter tolerance: OK from 92 % to 100 %. Below 92 % is information only at light load (below 20 % of module capacity) or when the internal main CB also feeds other AC loads. Above 100 % means the readings do not match.": "ان پٹ پاور = 1.732 × L-L وولٹیج × فیز کرنٹ (DC سسٹم کے اندرونی مین CB پر میٹر ریڈنگز کی اوسط)۔ آؤٹ پٹ پاور = DC آؤٹ پٹ وولٹیج × MCU پر دکھایا گیا ریکٹیفائرز کا کل کرنٹ۔ ایفیشینسی = آؤٹ پٹ ÷ ان پٹ۔ اسپیک کی کم از کم حد 95 %، میٹر کی درستگی کے لیے 3 % کم: 92 % سے 100 % تک OK۔ 92 % سے کم صرف معلومات ہے اگر لوڈ ہلکا ہو (ماڈیولز کی گنجائش کے 20 % سے کم) یا اندرونی مین CB دوس : OK mula 92 % hanggang 100 %. Mas mababa sa 92 % ay impormasyon lang kapag magaan ang load (mas mababa sa 20 % ng kapasidad ng modules) o kapag may iba pang AC load sa internal main CB. Higit sa 100 % ay nangangahulugang hindi tugma ang mga reading.", "AC input power and DC output power readings match (DC system efficiency ≥ 95 %).": "Tugma ang mga reading ng AC input power at DC output power (efficiency ng DC system ≥ 95 %).", "Enter the DC output voltage and total rectifier current": "Ilagay ang DC output voltage at kabuuang rectifier current", "MCU readings (if shown)": "Mga reading sa MCU (kung makikita)", "MCU – DC output voltage (V) – optional": "MCU – DC output voltage (V) – opsyonal", "MCU – total rectifier output current (A) – optional": "MCU – kabuuang output current ng rectifiers (A) – opsyonal", "Checked only when the MCU DC output voltage and total rectifier current are entered. Input power = 1.732 × L-L voltage × phase current (meter readings). Output power = DC voltage × total rectifier current. OK from 92 % to 100 %.": "Sinusuri lang kapag nailagay ang DC output voltage at kabuuang rectifier current ng MCU. Input power = 1.732 × L-L voltage × phase current (meter reading). Output power = DC voltage × kabuuang rectifier current. OK mula 92 % hanggang 100 %.", "Enter the L-L voltages and phase currents (AC input page)": "Ilagay ang mga L-L voltage at phase current (AC input page)", "Enter the MCU DC output voltage and total rectifier current (AC input page)": "Ilagay ang DC output voltage at kabuuang rectifier current ng MCU (AC input page)", "Answer the other AC loads question (AC input page)": "Sagutin ang tanong tungkol sa iba pang AC load (AC input page)", "No AC current measured – take the readings under load": "Walang nasukat na AC current – kunin ang mga reading habang may load"});

/* RTL: isolate whole left-to-right runs (Latin words, digits, units, symbols) inside Arabic/Urdu text */
var LTR_RUN=/(?:[≥≤<>±~]\s?)?[A-Za-z0-9#{][A-Za-z0-9#{}.,+\-\/×±≥≤²°%:–_&']*(?:[ ](?:[≥≤<>±~]\s?)?[A-Za-z0-9#{}.,+\-\/×±≥≤²°%:–_&']*[A-Za-z0-9²°%}])*/g;
function isoRuns(t){ return t.replace(LTR_RUN,function(m){ var tail=''; var k=m.match(/[.,:;]+$/); if(k){ tail=k[0]; m=m.slice(0,-tail.length); } return m? '⁦'+m+'⁩'+tail : tail; }); }
var L = function(s){ var t=(window.I18N && S && I18N[S.lang] && I18N[S.lang][s]) || s; if(typeof t!=='string') return t;
  if(S && (S.lang==='ar'||S.lang==='ur')){ if(t===s){ if(/^[\x20-\x7E²°±×–≥≤·…]+$/.test(s) && /[A-Za-z0-9]/.test(s)) t='⁦'+s+'⁩'; } else if(/[A-Za-z0-9]/.test(t)) t=isoRuns(t); }
  return t; };   // translation hook
var IMG_RE=/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/, ID_RE=/^[a-z0-9_]{2,40}$/i;

function fmtDT(d){ var x=new Date(new Date(d).getTime()+(3*60+new Date().getTimezoneOffset())*60000); if(isNaN(x)) return ''; return x.getFullYear()+'-'+pad2(x.getMonth()+1)+'-'+pad2(x.getDate())+' '+pad2(x.getHours())+':'+pad2(x.getMinutes())+' (Riyadh)'; }

/* ---- validate & normalise any state (saved or imported) so a bad file can never break the app ---- */

  n.created=(!isNaN(new Date(o.created)) && new Date(o.created)<=new Date())? str(o.created,40) : n.created; n.saved=str(o.saved,40)||null;

  var SEL={job_eq:EQUIPMENT.map(function(x){return x[0];}), job_proj:PROJECTS.map(function(x){return x[0];}), job_cust:CUSTOMERS, job_shelter:SHELTERS.map(function(x){return x[0];}), job_cat:CATEGORIES, job_scope:['New','Upgrade','Replacement'], job_region:Object.keys(REGIONS), bat_conn:['Y','N']};

  if(has(n.f.job_district) && (!n.f.job_region || REGIONS[n.f.job_region].indexOf(n.f.job_district)<0)) n.f.job_district='';

    x.st=pick(x.st,['New','Existing','Removed']); if(x.fz==='None') x.fz=''; x.tech=pick(x.tech,['Li-Ion','VRLA','OPzV']); if(x.st==='New') x.tech='Li-Ion'; x.fz=pick(x.fz,['Fuse','CB','Busbar']); x.cond=pick(x.cond,['OK','Degraded','Faulty','Vandalized']); if(x.fno && !/^([1-9]|1[0-6])$/.test(x.fno)) x.fno=''; n.bb.push(x); });
  if(o.ans && typeof o.ans==='object') for(k in o.ans){ var it0=Object.prototype.hasOwnProperty.call(ITEM_BY_ID,k)? ITEM_BY_ID[k] : null; if(it0 && it0.type!=='auto' && o.ans[k] && typeof o.ans[k]==='object'){ var a=o.ans[k], allowed=it0.type==='choice'? it0.choices.map(function(c){return c[0];}) : ['ok','nok']; n.ans[k]={v:pick(a.v,allowed), c:str(a.c,2000)}; if(a.fu==='Y'||a.fu==='N') n.ans[k].fu=a.fu; if(it0.ref && has(a.ref)) n.ans[k].ref=str(a.ref,80); } }

  if(o.ended && !isNaN(new Date(o.ended)) && new Date(o.ended)<=new Date()) n.ended=str(o.ended,40);
  if(!has(n.f.ac_kit) && (n.f.ac_meth==='A'||n.f.ac_meth==='B')) n.f.ac_kit = n.f.ac_meth==='B'?'Y':'N';   // v3.4 → v3.5 (R7a)
  if(has(n.f.ac_kit) && n.f.ac_kit!=='Y' && n.f.ac_kit!=='N') n.f.ac_kit='';
  function tbl(src,rows){ var t={}; if(src && typeof src==='object') rows.forEach(function(r){ var e=src[r.k]; if(e && typeof e==='object'){ t[r.k]={v:str(e.v,40)}; if(e.s) t[r.k].s=pick(e.s,['Major','Minor','Disabled']); if(e.u) t[r.k].u=pick(e.u,['A','%']); } }); return t; }
  n.mcu=tbl(o.mcu,MCU_ROWS); n.pre=tbl(o.pre,PRE_ROWS); n.hyr=tbl(o.hyr,HY_ROWS);
  if(o.bms && typeof o.bms==='object') BMS_ROWS.forEach(function(r,i){ var v=o.bms[i]; if(v==='ok'||v==='nok') n.bms[i]=v; });

var lastFix=null, GEO={ok:false,watch:null};
function saveFix(p){ lastFix={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()}; }
function getFix(cb){
  if(!navigator.geolocation){ cb(null,'none'); return; }
  if(lastFix && Date.now()-lastFix.t<600000){ cb(lastFix); return; }
  var done=false, fin=function(f,why){ if(done) return; done=true; cb(f,why); };
  var tm=setTimeout(function(){ fin(null,'timeout'); },20000);
  navigator.geolocation.getCurrentPosition(function(p){ clearTimeout(tm); saveFix(p); fin(lastFix); },
    function(e){ if(e.code===1){ clearTimeout(tm); fin(null,'denied'); return; }
      navigator.geolocation.getCurrentPosition(function(p){ clearTimeout(tm); saveFix(p); fin(lastFix); }, function(e2){ clearTimeout(tm); fin(null, e2.code===1?'denied':'nofix'); }, {enableHighAccuracy:false,timeout:8000,maximumAge:600000}); },
    {enableHighAccuracy:true,timeout:9000,maximumAge:120000});
}
function isIOS(){ return /iPhone|iPad|iPod/.test(navigator.userAgent); }
function gateShow(kind){

  var msg = kind==='insecure'? L('Location does not work when the checklist is opened as a file (from WhatsApp, e-mail or the phone storage). Open the checklist from its web link (https://…) instead.')
          : kind==='none'? (isIOS()?L('This browser has no location service. Use Safari on the iPhone.'):L('This browser has no location service. Use Chrome on the phone.'))
          : kind==='denied'? (isIOS()? L('Location is blocked. Open Settings → Privacy & Security → Location Services → Safari Websites, choose "While Using the App", then tap Try again.') : L('Location is blocked for this page. Open the browser settings → Site settings → Location, allow it for this page, then tap Try again.'))
          : kind==='checking'? L('Checking location…')

  g.innerHTML='<div class="gbox" role="alertdialog" aria-modal="true"><div class="gico">📍</div><h2>'+esc(L('Location is required'))+'</h2><p>'+esc(L('Tawal requires the phone location for every handover. It is stamped on every photo.'))+'</p>'
    +'<p class="gmsg'+(kind==='checking'?'':' bad')+'">'+esc(msg)+'</p>'+(kind==='none'||kind==='insecure'?'':'<button class="btn pri" data-act="geo">'+esc(kind==='denied'||kind==='off'?L('Try again'):L('Allow location'))+'</button>')+'</div>';
  g.hidden=false; document.body.classList.add('gated'); ['top','main','nav'].forEach(function(id){ var el=document.getElementById(id); if(el) el.inert=true; });
}

  GEO.watch=navigator.geolocation.watchPosition(function(p){ saveFix(p); if(!GEO.ok) gateHide(); }, function(e){ if(e.code===1){ navigator.geolocation.clearWatch(GEO.watch); GEO.watch=null; gateShow('denied'); } }, {enableHighAccuracy:true,maximumAge:60000,timeout:30000}); }
function geoCheck(){
  if(window.isSecureContext===false){ gateShow('insecure'); return; }   // e.g. opened from WhatsApp (content://): browsers never give location here
  if(!navigator.geolocation){ gateShow('none'); return; }
  gateShow('checking'); clearTimeout(GEO.tm); GEO.tm=setTimeout(function(){ if(!GEO.ok) gateShow('off'); },15000);
  navigator.geolocation.getCurrentPosition(function(p){ clearTimeout(GEO.tm); saveFix(p); gateHide(); geoWatch(); },
    function(e){ clearTimeout(GEO.tm); if(e.code===1) gateShow('denied'); else { gateHide(); geoWatch(); toast(L('Waiting for GPS…')); } },

}

   ============================================================ */
function stampFile(file, cb){
  var url=URL.createObjectURL(file), img=new Image();
  img.onload=function(){
    getFix(function(fix,why){
      if(!fix){ URL.revokeObjectURL(url); if(why==='denied'||why==='none') gateShow(why); else toast(L('No GPS position yet – move near a door or window and try again.')); return; }
      var W=img.naturalWidth, H=img.naturalHeight, sc=Math.min(1,1280/Math.max(W,H)); W=Math.round(W*sc); H=Math.round(H*sc);
      var c=document.createElement('canvas'); c.width=W; c.height=H; var g=c.getContext('2d'); g.drawImage(img,0,0,W,H);
      var l1=(S.f.job_tawal||'TAWAL ID ?')+'  ·  Site '+(S.f.job_site||'?');
      var l2=fmtDT(Date.now());
      var l3='GPS '+fix.lat.toFixed(6)+', '+fix.lon.toFixed(6)+' (±'+Math.round(fix.acc)+' m)';
      var fs=Math.max(14,Math.round(W/42)), bh=fs*3.9;
      g.fillStyle='rgba(0,0,0,.62)'; g.fillRect(0,H-bh,W,bh); g.fillStyle='#fff'; g.font='600 '+fs+'px system-ui,Arial,sans-serif';
      g.fillText(l1,fs*0.6,H-bh+fs*1.15); g.fillText(l2,fs*0.6,H-bh+fs*2.3); g.fillText(l3,fs*0.6,H-bh+fs*3.45);
      var t=document.createElement('canvas'), ts=Math.min(1,200/Math.max(W,H)); t.width=Math.round(W*ts); t.height=Math.round(H*ts); t.getContext('2d').drawImage(c,0,0,t.width,t.height);
      URL.revokeObjectURL(url);
      cb(c.toDataURL('image/jpeg',0.72), t.toDataURL('image/jpeg',0.7), fix);
    });
  };
  img.onerror=function(){ URL.revokeObjectURL(url); toast(L('Could not read this image')); };
  img.src=url;
}

/* Import is all-or-nothing: the backup must bring its own photos, every photo must decode, and the new job

function importData(raw, done){
  function fail(msg){ toast(L(msg)); if(done) done(false); }
  var n=(raw && typeof raw==='object' && raw.f && typeof raw.f==='object' && Array.isArray(raw.bb))? normalise(raw) : null; if(!n) return fail('This file is not a handover backup');
  var pd={}; if(raw.photoData && typeof raw.photoData==='object') Object.keys(raw.photoData).forEach(function(id){ var d=raw.photoData[id]; if(/^p[a-z0-9_]{2,30}$/i.test(id) && safeSrc(d) && d.length<=12*1024*1024) pd[id]=d; });

    Object.keys(n.photos).forEach(function(k){ n.photos[k]=n.photos[k].filter(function(id){ return !!good[id]; }); if(!n.photos[k].length) delete n.photos[k]; });
    if(n.lastph && !good[n.lastph.id]) n.lastph=null;
    var dropped=used.length-Object.keys(good).length;
    var savePH=PH, savePHT=PHT; PH=good; PHT={}; var prevS=S; S=n; var okEval=true; try{ evaluate(); }catch(e){ okEval=false; } S=prevS; PH=savePH; PHT=savePHT;
    if(!okEval) return fail('This file is not a handover backup');
    if(!confirmBox(L('Replace the current handover with this backup?')+(dropped? ' '+dropped+' '+L('photo(s) in the backup are missing or damaged and will need to be taken again.') : ''))) { if(done) done(false); return; }
    if(!STORE_OK) return fail('This phone is not saving your work – the backup cannot be opened.');
    var ids=Object.keys(good); if(ids.length && !DB) return fail('This phone is not saving photos – the backup cannot be opened.');
    n.lang=S.lang; n.imported=new Date().toISOString();
    var oldIds=allPhotoIds(), overlap={}; ids.forEach(function(id){ if(PH[id]) overlap[id]=PH[id]; });
    function commitState(){
      n.saved=new Date().toISOString();
      try{ store.setItem(SAVE_KEY, JSON.stringify(n)); }catch(e){
        // state could not be stored: undo the photo writes and keep the current job
        if(DB && ids.length){ try{ var st=DB.transaction('p','readwrite').objectStore('p'); ids.forEach(function(id){ if(overlap[id]) st.put(overlap[id],id); else st.delete(id); }); }catch(e2){} }
        return fail('Could not save – phone storage is full. The current handover was kept.');
      }
      oldIds.forEach(function(id){ if(!good[id]) dbDel(id); });
      ids.forEach(function(id){ PH[id]=good[id]; delete PHT[id]; if(DB){ try{ DB.transaction('p','readwrite').objectStore('p').delete(id+'_t'); }catch(e){} } });
      S=n; try{ render(); }catch(e){}

    }

    catch(e){ fail('Photos could not be saved – phone storage is full. The current handover was kept.'); }
  }

  cand.forEach(function(id){ imgOk(pd[id],function(ok){ if(ok) good[id]=pd[id]; if(--left===0) next(); }); });
}

  h+='<tr><th>Contractor</th><td>'+esc(f.job_contr)+'</td><th>Technician</th><td>'+esc(f.job_tech)+'<br>'+esc(f.job_tech_ph)+'</td><th>MSP representative</th><td>'+esc(f.job_msp)+'<br>'+esc(f.job_msp_ph)+'</td></tr></table>';
  if(S.imported) h+='<p class="calc">Opened from a backup file on '+esc(fmtDT(S.imported))+'.</p>';
  h+='<div class="res" style="color:'+col+';border:2px solid '+col+'">'+stTxt+' · '+ev.major+' Major · '+ev.minor+' Minor · '+ev.msp.length+' MSP snag(s) · '+ev.info.length+' info</div>';
  function list(a,title){ var s='<h2>'+title+' ('+a.length+')</h2>'; if(!a.length) return s+'<p>None</p>'; s+='<table><tr><th style="width:44px">#</th><th style="width:52px">Sev.</th><th>Description</th></tr>'; a.forEach(function(x){ s+='<tr><td>'+esc(x.num)+'</td><td>'+esc(x.sev)+'</td><td>'+esc(x.text)+'</td></tr>'; }); return s+'</table>'; }
  h+=list(ev.nc,'Non-conformances (implementer)')+list(ev.msp,'Pre-existing snags for O&M MSP (Minor)')+(ev.info.length?list(ev.info,'Information only'):'');
  if(ev.shown.length){ h+='<h2>Not completed ('+ev.shown.length+')</h2><table>'; ev.shown.forEach(function(m){ h+='<tr><td>'+esc((SECTIONS.filter(function(s){return s.id===m.sec;})[0]||{}).t||'')+'</td><td>'+esc(m.label)+'</td></tr>'; }); h+='</table>'; }
  function kv(sid,title){ var fs=(FIELDS[sid]||[]).filter(function(fd){return fieldShown(fd,C)&&has(S.f[fd.k]);}); if(!fs.length) return ''; var s='<h2>'+title+'</h2><table>'; fs.forEach(function(fd){ var v=S.f[fd.k]; if(fd.type==='sel') v=optLabel(fd.o(C),v); s+='<tr><th style="width:45%">'+esc(fd.l)+'</th><td>'+esc(v)+'</td></tr>'; }); return s+'</table>'; }
  if(secShown('ac',C)){ h+=kv('ac','AC input data'); h+='<table><tr>'+AC_READ.map(function(r){return '<th>'+esc(r.l)+'</th>';}).join('')+'</tr><tr>'+AC_READ.map(function(r){return '<td>'+esc(S.f[r.k])+'</td>';}).join('')+'</tr></table>'; if(C.sys) h+='<p class="calc">Detected site supply: '+C.sys+' V · Phase imbalance '+(isFinite(measuredImbalance(C))?r2(measuredImbalance(C))+' %':'—')+' (limit '+(isFinite(balanceLimit(C.nmod))?r2(balanceLimit(C.nmod))+' %':'—')+')</p>'; }
  if(secShown('dc',C)) h+=kv('dc','DC system data');
  if(C.noBB) h+='<h2>Batteries</h2><p>No batteries connected yet – battery checks are done in the later battery handover.</p>';
  else if(C.nBB||S.bb.length){ h+='<h2>Battery register</h2><table><tr><th>#</th><th>Status</th><th>Tech</th><th>Brand / model</th><th>Ah</th><th>Mfg</th><th>S/N</th><th>Condition</th><th>Connected to</th><th>Rating (A)</th></tr>';
    S.bb.forEach(function(r,i){ var con=r.fz==='Busbar'?'Direct to busbar':(r.fz||'')+(r.fno?' #'+r.fno:''); h+='<tr><td>'+(i+1)+'</td><td>'+esc(r.st)+'</td><td>'+esc(r.tech)+'</td><td>'+esc(r.brand==='Other'?r.brandO:(r.brand||'')+' '+(r.model||''))+'</td><td>'+esc(r.ah)+'</td><td>'+esc(r.mfg)+'</td><td>'+esc(r.sn)+'</td><td>'+esc(r.cond)+'</td><td>'+esc(con)+'</td><td>'+esc(r.rat)+'</td></tr>'; }); h+='</table>'; h+=kv('bat','Battery details'); }
  function rres(row,store,as){ var e=store[row.k]||{}, v=row.type==='sel'?e.v:num(e.v), ok=null; if((row.type==='sel'&&has(v))||(row.type!=='sel'&&isFinite(v))){ if(!row.unit||e.u) ok=row.pass(v,C,e.u); } if(ok===null) return ['na','—']; if(as && !has(e.s)) return ['na','—']; var good=ok&&(!as||e.s===as); return [good?'ok':'nok',good?'PASS':'FAIL']; }
  if(secShown('mcu',C)){ h+='<h2>DC system settings (MCU)</h2><table><tr><th>Setting</th><th>Target</th><th>Value</th><th>Alarm severity</th><th>Result</th><th>Photo</th></tr>';
    MCU_ROWS.forEach(function(row){ if(!mcuRowShown(row,C)) return; var e=S.mcu[row.k]||{}, as=val(row.as,C), rr=rres(row,S.mcu,as); h+='<tr><td>'+esc(row.l)+'</td><td>'+esc(val(row.t,C))+(as?' · '+as:'')+'</td><td>'+esc(e.v)+(e.u?' '+esc(e.u):'')+'</td><td>'+esc(e.s||'')+'</td><td class="'+rr[0]+'">'+rr[1]+'</td><td>'+(hasPhoto('m_'+row.k)?'✓':'—')+'</td></tr>'; }); h+='</table>'; }
  if(secShown('bms',C)){ h+='<h2>Battery pre-configured settings</h2><table><tr><th>Setting</th><th>Target</th><th>Value</th><th>Result</th><th>Photo</th></tr>'; PRE_ROWS.forEach(function(row){ var e=S.pre[row.k]||{}, rr=rres(row,S.pre); h+='<tr><td>'+esc(row.l)+'</td><td>'+esc(val(row.t,C))+'</td><td>'+esc(e.v)+'</td><td class="'+rr[0]+'">'+rr[1]+'</td><td>'+(hasPhoto('p_'+row.k)?'✓':'—')+'</td></tr>'; }); h+='</table>';
    h+='<h2>BMS alarm & protection table</h2><table><tr><th>Protection</th><th>Thresholds</th><th>Result</th></tr>'; BMS_ROWS.forEach(function(r,i){ var v=S.bms[i]; h+='<tr><td>'+esc(r[1])+'</td><td class="calc">'+esc(r[2]+' · '+r[4]+' · Ext: '+r[5])+'</td><td class="'+(v==='ok'?'ok':v==='nok'?'nok':'na')+'">'+(v?v.toUpperCase():'—')+'</td></tr>'; }); h+='</table>'; }
  if(secShown('hy',C)){ h+=kv('hy','Hybrid data')+'<table><tr><th>Setting</th><th>Target</th><th>Value</th><th>Result</th><th>Photo</th></tr>'; HY_ROWS.forEach(function(row){ var e=(S.hyr||{})[row.k]||{}, rr=rres(row,S.hyr||{}); h+='<tr><td>'+esc(row.l)+'</td><td>'+esc(row.t)+'</td><td>'+esc(e.v)+'</td><td class="'+rr[0]+'">'+rr[1]+'</td><td>'+(hasPhoto('h_'+row.k)?'✓':'—')+'</td></tr>'; }); h+='</table>'; }
  SECTIONS.forEach(function(sec){ if(sec.id==='job'||sec.id==='res'||!secShown(sec.id,C)) return; var its=ITEMS.filter(function(it){return it.sec===sec.id&&itemShown(it,C);}); if(!its.length){ if(sec.id==='bat' && C.noBB) h+='<h2>'+ev.num['sec:bat']+'. Batteries – not connected yet</h2>'; return; }
    h+='<h2>'+ev.num['sec:'+sec.id]+'. '+esc(sec.t)+'</h2><table><tr><th style="width:40px">#</th><th>Check</th><th style="width:60px">Sev.</th><th style="width:60px">Result</th><th style="width:34%">Details</th></tr>';
    its.forEach(function(it){ var e=evalItem(it,C), a=S.ans[it.id]||{}, own=ownerOf(it,C); var res=e.r==='ok'?'OK':e.r==='nok'?'NOK':e.r==='na'?'N/A':'—';
      var sv = own==='msp'? 'MSP (Minor)' : (it.type==='choice' && e.r!=='nok')? '—' : (e.sev || itemSev(it,C));
      if(e.r==='nok' && (sv==='Info'||sv==='NA'||e.sev==='Info'||e.sev==='NA')){ sv='Info'; res='INFO'; }
      var det=[]; if(it.type==='auto') det.push('Automatic'); if(e.msg) det.push(e.msg); if(e.calc) det.push(e.calc); if(it.ref&&has(a.ref)) det.push(it.ref.l+': '+a.ref); if(has(a.c)) det.push('Comment: '+a.c); var ph=(S.photos[it.id]||[]).filter(function(id){return !!PH[id];}).length; if(ph) det.push(ph+' photo(s)'); else if(needsPhoto(it)) det.push('photo missing');
      h+='<tr><td>'+esc(ev.num[it.id])+'</td><td>'+esc(itemText(it,C))+'</td><td>'+esc(sv)+'</td><td class="'+(res==='INFO'?'na':(e.r||'na'))+'">'+res+'</td><td class="calc">'+esc(det.join(' · '))+'</td></tr>'; });
    h+='</table>'; });
  if(has(f.close_haz)) h+='<h2>Hazards reported</h2><p>'+esc(f.close_haz)+'</p>';
  var byId={}, order=[], ks=shownPhotoKeys(C);
  Object.keys(S.photos).forEach(function(k){ if(!ks[k]) return; (S.photos[k]||[]).forEach(function(id){ if(!safeSrc(PH[id])) return; var lbl = ev.num[k]&&ITEM_BY_ID[k]? ev.num[k]+' '+itemText(ITEM_BY_ID[k],C) : (rowPhotoLabel(k) || (k.indexOf('bb_')===0? 'Battery #'+(S.bb.map(function(r){return 'bb_'+r.id;}).indexOf(k)+1)+' S/N label' : null) || (k==='haz'?'Hazard':k==='es_sol'?'ES solution (fuse sharing)':k==='m_legacy'?'MCU settings':null) || (photoSlots(C).filter(function(p){return p.k===k;})[0]||{l:k}).l); if(!byId[id]){ byId[id]=[]; order.push(id); } byId[id].push(lbl); }); });
  if(order.length){ h+='<h2>Photo evidence ('+order.length+')</h2>'; order.forEach(function(id){ h+='<div class="ph"><img src="'+safeSrc(PH[id])+'" alt=""><div>'+esc(byId[id].join(' · '))+'</div></div>'; }); }
  h+='<p class="calc" style="margin-top:10px">Generated '+esc(fmtDT(Date.now()))+' · TAWAL O&M handover checklist v'+APP_VERSION+' build '+APP_BUILD+'</p></div>';
  $('#report').innerHTML=h;
}

   START
   ============================================================ */
function start(){
  S = load() || blankState();
  if(S.started && new Date(S.started)>new Date()) S.started=new Date().toISOString();
  $('#logo').src=TAWAL_LOGO_SRC;
  $('#ver').textContent='v'+APP_VERSION;
  bindEvents();
  try{ history.replaceState({page:S.page},''); }catch(e){}
  dbOpen(function(){ dbLoadAll(allPhotoIds(),function(){ render(); geoCheck(); }); });
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible' && !GEO.ok) geoCheck(); });
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){ try{ var hadCtl=!!navigator.serviceWorker.controller; navigator.serviceWorker.register('sw.js').then(function(reg){ try{ reg.update(); }catch(e){} }).catch(function(){}); navigator.serviceWorker.addEventListener('controllerchange',function(){ if(hadCtl){ var b=document.createElement('button'); b.className='updbar'; b.textContent=L('A new version of the checklist is ready – tap to reload (your work is saved)'); b.onclick=function(){ save(true); location.reload(); }; var x=document.createElement('button'); x.className='updx'; x.textContent='×'; x.setAttribute('aria-label',L('Close')); x.onclick=function(){ b.remove(); x.remove(); }; document.body.appendChild(b); document.body.appendChild(x); } }); }catch(e){} }
  if(navigator.storage && navigator.storage.persist){ try{ navigator.storage.persist(); }catch(e){} }
}
document.addEventListener('DOMContentLoaded',start);
